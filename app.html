<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de estudos · INSS, BACEN e Receita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única de leitura; início lista as aulas por disciplina; aula e teste na mesma página, com barra de correção fixa no rodapé */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --ink:#16242b; --muted:#566a73; --line:#d5dde1;
  --accent:#0d6672; --accent-ink:#ffffff; --accent-soft:#dcedf0;
  --ok:#1f7a45; --ok-soft:#dff2e6; --bad:#b3372b; --bad-soft:#f8e1de; --warn:#7a6410; --warn-soft:#f5ecc8;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f181c; --surface:#18252b; --ink:#e6eef1; --muted:#9db0b8; --line:#2c3d45;
    --accent:#5cc3d0; --accent-ink:#06262b; --accent-soft:#143840;
    --ok:#6fd198; --ok-soft:#143524; --bad:#f08f84; --bad-soft:#40201c; --warn:#e2c865; --warn-soft:#3a3212;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f181c; --surface:#18252b; --ink:#e6eef1; --muted:#9db0b8; --line:#2c3d45;
  --accent:#5cc3d0; --accent-ink:#06262b; --accent-soft:#143840;
  --ok:#6fd198; --ok-soft:#143524; --bad:#f08f84; --bad-soft:#40201c; --warn:#e2c865; --warn-soft:#3a3212;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
main{max-width:680px;margin:0 auto;padding:20px 16px 120px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
a{color:var(--accent)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 16px;min-height:44px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:focus-visible,.opt:focus-visible,.row:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.back{align-self:flex-start;font-weight:700;text-decoration:none}

/* início */
.status{font-size:14px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.status.local{background:var(--warn-soft)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
details.disc{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.disc > summary{cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-family:var(--display);font-weight:700;font-size:18px}
details.disc > summary span{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mod{padding:10px 16px 4px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 16px;text-decoration:none;color:var(--ink);min-height:44px}
.row .code{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;color:var(--accent)}
.row.off{color:var(--muted)} .row.off .code{color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ready{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.pill.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.pill.mid{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.pill.low{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.mod{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:none;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.tag.only{background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.nucleo{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.nucleo h3{font-size:19px}
.later{margin:0;padding-left:20px;font-size:15px;color:var(--muted)}
.conc{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.conc:first-of-type{border-top:0;padding-top:0}
.conc b{font-family:var(--display);font-size:17px}
.conc .line{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:15px}
.pill.ofi{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.pill.prev{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.today .blk{display:flex;flex-direction:column;gap:2px}
.today .blk b{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.next{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);min-height:44px}
.next .code{font-weight:700;font-size:14px;color:var(--accent)}
.next.off{color:var(--muted)} .next.off .code{color:var(--muted)}
.week{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.week li{display:grid;grid-template-columns:76px 1fr;gap:8px}
.week li.now{font-weight:700}
details.more > summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.more[open] > summary{margin-bottom:8px}
.revgrp{display:flex;flex-direction:column;gap:6px}
.revgrp h3{font-size:16px}

/* aula */
.lesson{display:flex;flex-direction:column;gap:14px}
.lesson h2{margin-top:14px;padding-top:12px;border-top:2px solid var(--accent)}
.lesson h3{margin-top:6px}
.lesson ul,.lesson ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.lesson .box{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.lesson .box.trap{border-color:var(--bad);background:var(--bad-soft)}
.lesson .box.memo{border-color:var(--warn);background:var(--warn-soft)}
.lesson .box b:first-child{display:block}
.tablewrap{overflow-x:auto}
.lesson details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.lesson summary{cursor:pointer;font-weight:600}
.lesson details p{margin-top:8px}
.lesson table{border-collapse:collapse;width:100%;font-size:15px}
.lesson th,.lesson td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.lesson th{background:var(--accent-soft)}

/* teste */
.group{display:flex;flex-direction:column;gap:12px}
.group > h3{padding-top:10px;border-top:2px solid var(--accent)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.q-head{display:flex;gap:8px;align-items:baseline;justify-content:space-between;font-size:13px;color:var(--muted)}
.q-num{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt.skip{color:var(--muted);font-size:15px}
.done .opt{cursor:default}
.done .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.done .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{display:none;border-left:4px solid var(--line);padding:8px 12px;font-size:16px;border-radius:0 6px 6px 0}
.done .fb{display:block}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb.skip{border-color:var(--warn);background:var(--warn-soft)}
.fb strong{display:block}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none}
.bar.show{display:block}
.bar-in{max-width:680px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.count{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.score{font-family:var(--display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.rows{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;font-size:15px}
.srow .track{grid-column:1 / -1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.srow .fill{height:100%;background:var(--accent)}
.srow b{font-variant-numeric:tabular-nums}
#saveMsg{font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<main id="app"><p class="muted">Carregando o curso…</p></main>
<div class="bar" id="bar"><div class="bar-in"><span class="count" id="count"></span><button class="btn" id="gradeBtn" type="button">Corrigir teste</button></div></div>

<script>
var DOCS = [
  ["Plano integrado: INSS, Banco Central e Receita (24/11/2026)", "https://claude.ai/artifact/Bb2181uYYNkWdfpywU9G3u"],
  ["Etapa 1: relatório da pesquisa", "https://claude.ai/artifact/QwrKyEtMV8FQtALUftWwJB"],
  ["Etapa 2: conteúdo e mapa do curso", "https://claude.ai/artifact/7DSyxgPXayR6XbgffZMm9S"],
  ["Etapa 3: cronograma de estudos", "https://claude.ai/artifact/Fd2BFY4tPBJWeJf6ADp9dk"]
];
var DNAMES = {PV:"Direito Previdenciário",LP:"Língua Portuguesa",DC:"Direito Constitucional",DA:"Direito Administrativo",RL:"Raciocínio Lógico",IN:"Informática",ET:"Ética no Serviço Público",TP:"Técnica de prova",ES:"Estatística",DE:"Diagnóstico das específicas"};
var DORDER = ["PV","LP","DC","DA","RL","IN","ET","TP","ES","DE"];

var app = document.getElementById("app"), bar = document.getElementById("bar");
var catalog = null, ready = [], notas = {}, db = null, dbState = "espera"; // espera | conta | local
var plano = null; // data/plano.json: fase, semana, concursos (opcional)
var cur = null; // teste aberto: {id, data, answers, graded, diag}

function el(tag, cls, text){ var n = document.createElement(tag); if(cls) n.className = cls; if(text != null) n.textContent = text; return n; }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k) || "null"); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
// Fonte das aulas: GitHub (atualiza sozinho) -> arquivos locais -> cópia guardada no navegador
var REMOTE = "https://raw.githubusercontent.com/jonasspinoladev/curso-inss/main/";
var onlineOk = null;
function fetchJSON(url){ return fetch(url, {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(url); return r.json(); }); }
function getJSON(path){
  var key = "inss-cache-" + path;
  var useRemote = location.protocol.indexOf("http") === 0 && location.hostname !== "claude.ai" && !/claudeusercontent|claude\.ai/.test(location.hostname);
  var p = useRemote ? fetchJSON(REMOTE + path + "?t=" + Date.now()).then(function(v){ onlineOk = true; return v; }) : Promise.reject();
  return p.catch(function(){ if(useRemote) onlineOk = false; return fetchJSON(path); })
    .then(function(v){ lsSet(key, v); return v; })
    .catch(function(){ var c = lsGet(key); if(c) return c; throw new Error(path); });
}
function route(){ var h = (location.hash || "").replace("#", "").toLowerCase(); return /^[a-z0-9-]+$/.test(h) ? h : "inicio"; }
function pct(n, t){ return t ? Math.round(n / t * 100) : 0; }
function pillFor(id){
  var n = notas[id];
  if(n && n.total){ var p = pct(n.melhor, n.total); return ["pill " + (p >= 70 ? "good" : p >= 50 ? "mid" : "low"), n.melhor + "/" + n.total]; }
  if(ready.indexOf(id) >= 0) return ["pill ready", "Disponível"];
  return ["pill", "Não criada"];
}

/* ---------- notas: conta (db) com cópia local ---------- */
var local = false; // true quando roda no servidor.py do seu computador
function initNotas(){
  notas = lsGet("inss-notas") || {};
  fetch("api/notas", {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("sem servidor local");
    return r.json();
  }).then(function(v){
    local = true;
    Object.keys(v || {}).forEach(function(k){ notas[k] = v[k]; });
    lsSet("inss-notas", notas); dbState = "pasta"; refreshHome();
  }).catch(initDb);
}
function initDb(){
  var p = (window.claude && typeof window.claude.use === "function") ? window.claude.use("db") : Promise.resolve(null);
  Promise.resolve(p).then(function(d){
    if(!d){ dbState = "local"; refreshHome(); return; }
    db = d;
    return db.collection("notas").get().then(function(s){
      s.docs.forEach(function(doc){ var v = doc.data(); if(v) notas[doc.id] = v; });
      lsSet("inss-notas", notas); dbState = "conta"; refreshHome();
    });
  }).catch(function(){ dbState = "local"; refreshHome(); });
}
function saveNota(id, rec){
  notas[id] = rec; lsSet("inss-notas", notas);
  var msg = document.getElementById("saveMsg");
  if(local){
    if(msg) msg.textContent = "Salvando a nota…";
    fetch("api/notas", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({id:id, registro:rec})})
      .then(function(r){ if(!r.ok) throw new Error(); if(msg) msg.textContent = "Nota salva no arquivo notas.json do curso."; })
      .catch(function(){ if(msg) msg.textContent = "O servidor local não respondeu. A nota ficou guardada no navegador."; });
    return;
  }
  if(!db){ if(msg) msg.textContent = "Nota salva só neste aparelho."; return; }
  if(msg) msg.textContent = "Salvando a nota…";
  db.doc("notas/" + id).set(rec).then(function(){ if(msg) msg.textContent = "Nota salva na sua conta."; },
    function(){ if(msg) msg.textContent = "Não foi possível salvar na conta agora. A nota ficou guardada neste aparelho."; });
}
function refreshHome(){ if(route() === "inicio" && catalog) renderHome(); }

/* ---------- início ---------- */
function renderHome(){
  cur = null; bar.classList.remove("show"); app.textContent = "";
  var head = el("header", "stack");
  head.appendChild(el("span", "kicker", "INSS · Banco Central · Receita Federal"));
  head.appendChild(el("h1", null, "Central de estudos"));
  head.appendChild(el("p", "muted", "Plano integrado para os três concursos. Cada aula criada fica aqui, com o teste que você pode refazer quando quiser."));
  app.appendChild(head);

  var st = el("div", "status" + (dbState === "local" ? " local" : ""));
  st.textContent = dbState === "pasta" ? "Notas salvas no arquivo notas.json, na pasta do curso." : dbState === "conta" ? "Suas notas ficam salvas na sua conta e aparecem em qualquer aparelho."
    : dbState === "local" ? "Notas salvas neste navegador. Use Exportar notas, no fim da página, para fazer backup." : "Conectando ao registro de notas…";
  app.appendChild(st);

  var total = 0, feitas = 0, criadas = 0, soma = 0, somaT = 0;
  catalog.disciplinas.forEach(function(d){ d.modulos.forEach(function(m){ m.aulas.forEach(function(a){
    total++; var id = a[0].toLowerCase();
    if(ready.indexOf(id) >= 0) criadas++;
    if(notas[id] && notas[id].total){ feitas++; soma += notas[id].melhor; somaT += notas[id].total; }
  }); }); });
  var tiles = el("div", "tiles");
  [[criadas + "/" + total, "aulas criadas"], [String(feitas), "testes feitos"], [somaT ? pct(soma, somaT) + "%" : "–", "média nos testes"]].forEach(function(t){
    var x = el("div", "tile"); x.appendChild(el("b", null, t[0])); x.appendChild(el("span", null, t[1])); tiles.appendChild(x);
  });
  app.appendChild(tiles);

  if(plano){ renderToday(); renderReviews(); renderConcursos(); }

  var start = el("section", "card");
  start.appendChild(el("span", "kicker", "Comece aqui"));
  start.appendChild(el("h2", null, "Teste diagnóstico"));
  var dn = notas.diagnostico;
  start.appendChild(el("p", "muted", dn && dn.total ? "Última nota: " + dn.ultima + "/" + dn.total + " · melhor: " + dn.melhor + "/" + dn.total + " · tentativas: " + dn.tentativas
    : "40 questões das sete disciplinas, para medir de onde você parte. Leva de 40 a 60 minutos."));
  var b = el("a", "btn", dn && dn.total ? "Refazer o diagnóstico" : "Fazer o diagnóstico"); b.href = "#diagnostico";
  var bw = el("div", "btns"); bw.appendChild(b); start.appendChild(bw);
  app.appendChild(start);

  var next = null;
  catalog.disciplinas.forEach(function(d){ d.modulos.forEach(function(m){ m.aulas.forEach(function(a){
    var id = a[0].toLowerCase(); if(!next && ready.indexOf(id) >= 0 && !(notas[id] && notas[id].total)) next = a;
  }); }); });
  if(next){
    var nx = el("section", "card");
    nx.appendChild(el("span", "kicker", "Próxima aula disponível"));
    nx.appendChild(el("h2", null, next[0] + " · " + next[1]));
    var nb = el("a", "btn", "Abrir a aula"); nb.href = "#" + next[0].toLowerCase();
    var nw = el("div", "btns"); nw.appendChild(nb); nx.appendChild(nw); app.appendChild(nx);
  }

  var sec = el("section", "stack");
  sec.appendChild(el("h2", null, "Aulas"));
  sec.appendChild(el("p", "muted small", "As aulas são criadas sob demanda. Peça no chat “próxima aula” ou o código, como DA01."));
  var openCode = todayPlan() && todayPlan().disc.length ? todayPlan().disc[0] : null;
  function discBlock(d, i){
    var det = el("details", "disc"); if(openCode ? d.id === openCode : i === 0) det.open = true;
    var n = 0, c = 0;
    d.modulos.forEach(function(m){ m.aulas.forEach(function(a){ n++; if(ready.indexOf(a[0].toLowerCase()) >= 0) c++; }); });
    var sum = el("summary"); sum.appendChild(document.createTextNode(d.nome)); sum.appendChild(el("span", null, c + " de " + n + " criadas")); det.appendChild(sum);
    d.modulos.forEach(function(m, k){
      var mh = el("div", "mod"); mh.appendChild(el("span", null, "Módulo " + (k + 1) + " · " + m.nome));
      if(m.tag) mh.appendChild(el("span", "tag" + (/^Só/.test(m.tag) ? " only" : ""), m.tag));
      det.appendChild(mh);
      m.aulas.forEach(function(a){
        var id = a[0].toLowerCase(), on = ready.indexOf(id) >= 0;
        var r = el(on ? "a" : "div", "row" + (on ? "" : " off")); if(on) r.href = "#" + id;
        r.appendChild(el("span", "code", a[0])); r.appendChild(el("span", null, a[1]));
        var p = pillFor(id); r.appendChild(el("span", p[0], p[1])); det.appendChild(r);
      });
    });
    return det;
  }
  if(catalog.nucleos){
    catalog.nucleos.forEach(function(nc){
      var box = el("div", "nucleo");
      box.appendChild(el("h3", null, nc.nome));
      if(nc.desc) box.appendChild(el("p", "muted small", nc.desc));
      sec.appendChild(box);
      catalog.disciplinas.forEach(function(d, i){ if(d.nucleo === nc.id) sec.appendChild(discBlock(d, i)); });
      if(nc.depois && nc.depois.length){
        sec.appendChild(el("p", "small muted", "Entram depois dos editais:"));
        var ul = el("ul", "later"); nc.depois.forEach(function(t){ ul.appendChild(el("li", null, t)); }); sec.appendChild(ul);
      }
    });
  } else catalog.disciplinas.forEach(function(d, i){ sec.appendChild(discBlock(d, i)); });
  app.appendChild(sec);

  var bk = el("section", "card");
  bk.appendChild(el("h3", null, "Backup das notas"));
  bk.appendChild(el("p", "muted small", "Exporte de vez em quando. Se trocar de navegador ou limpar os dados, importe o arquivo para recuperar as notas."));
  var bb = el("div", "btns");
  var ex = el("button", "btn ghost", "Exportar notas"); ex.type = "button";
  ex.addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(notas, null, 1)], {type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "notas-inss-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    bmsg.textContent = "Arquivo de notas gerado. Confira a pasta de downloads.";
  });
  var imLabel = el("label", "btn ghost", "Importar notas"); imLabel.setAttribute("for", "importFile");
  var im = el("input"); im.type = "file"; im.id = "importFile"; im.accept = "application/json,.json"; im.hidden = true;
  im.addEventListener("change", function(){
    var f = im.files && im.files[0]; if(!f) return;
    f.text().then(function(t){
      var v = JSON.parse(t); if(!v || typeof v !== "object") throw new Error();
      Object.keys(v).forEach(function(k){
        var r = v[k]; if(!r || typeof r !== "object") return;
        var o = notas[k];
        if(!o || (r.tentativas || 0) >= (o.tentativas || 0)) notas[k] = r;
        if(local) fetch("api/notas", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({id:k, registro:notas[k]})}).catch(function(){});
      });
      lsSet("inss-notas", notas); renderHome();
    }).catch(function(){ bmsg.textContent = "Esse arquivo não é um backup de notas válido."; });
  });
  bb.appendChild(ex); bb.appendChild(imLabel); bk.appendChild(bb); bk.appendChild(im);
  var bmsg = el("div", "small muted"); bmsg.setAttribute("role", "status"); bk.appendChild(bmsg);
  if(dbState !== "conta") app.appendChild(bk);

  var docs = el("section", "card");
  docs.appendChild(el("h3", null, "Documentos do curso"));
  var ul = el("div", "stack");
  DOCS.forEach(function(d){ var a = el("a", null, d[0]); a.href = d[1]; a.target = "_blank"; a.rel = "noopener"; ul.appendChild(a); });
  docs.appendChild(ul); app.appendChild(docs);
}

/* ---------- plano integrado: hoje, revisões e concursos ---------- */
var DAY = 864e5;
function isoLocal(d){ var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (dd < 10 ? "0" : "") + dd; }
function brDate(iso){ var p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function todayPlan(){
  if(!plano || !plano.semana) return null;
  var w = new Date().getDay();
  for(var i = 0; i < plano.semana.length; i++) if(plano.semana[i].dia === w) return plano.semana[i];
  return null;
}
function findAula(code){
  var r = null;
  catalog.disciplinas.forEach(function(d){ d.modulos.forEach(function(m){ m.aulas.forEach(function(a){ if(a[0] === code) r = a; }); }); });
  return r;
}
function nextIn(disc){
  var r = null;
  catalog.disciplinas.forEach(function(d){ if(d.id !== disc) return; d.modulos.forEach(function(m){ m.aulas.forEach(function(a){
    var id = a[0].toLowerCase(); if(!r && !(notas[id] && notas[id].total)) r = a;
  }); }); });
  return r;
}
function aulaRow(a){
  var id = a[0].toLowerCase(), on = ready.indexOf(id) >= 0;
  var r = el(on ? "a" : "div", "next" + (on ? "" : " off")); if(on) r.href = "#" + id;
  r.appendChild(el("span", "code", a[0])); r.appendChild(el("span", null, a[1]));
  var p = pillFor(id); r.appendChild(el("span", p[0], p[1])); return r;
}

function renderToday(){
  var t = todayPlan(), f = plano.fase || {}, bl = f.blocos || ["1h30", "30 min"];
  var c = el("section", "card today");
  c.appendChild(el("span", "kicker", (f.nome ? f.nome + " · " : "") + (t ? "hoje, " + t.nome.toLowerCase() : "hoje")));
  if(t){
    c.appendChild(el("h2", null, t.titulo));
    [["Bloco 1 · " + bl[0], t.bloco1], ["Bloco 2 · " + bl[1], t.bloco2]].forEach(function(b){
      var x = el("div", "blk"); x.appendChild(el("b", null, b[0])); x.appendChild(el("p", null, b[1])); c.appendChild(x);
    });
    if(t.dia === 0 && (plano.revisoes30 || []).indexOf(isoLocal(new Date())) >= 0)
      c.appendChild(el("p", "status", "Hoje é dia de revisão de 30 dias: troque o simulado pela revisão das aulas de um mês atrás."));
    (t.disc || []).forEach(function(code){
      var a = nextIn(code); if(!a) return;
      c.appendChild(el("p", "small muted", "Próxima aula de " + (DNAMES[code] || code) + ":"));
      c.appendChild(aulaRow(a));
      if(ready.indexOf(a[0].toLowerCase()) < 0) c.appendChild(el("p", "small muted", "Peça no chat: “criar a aula " + a[0] + "”."));
    });
  }
  var det = el("details", "more"); det.appendChild(el("summary", null, "Semana inteira e meta da fase"));
  var ul = el("ul", "week");
  plano.semana.slice().sort(function(a, b){ return (a.dia + 6) % 7 - (b.dia + 6) % 7; }).forEach(function(s){
    var li = el("li", s === t ? "now" : null); li.appendChild(el("span", null, s.nome)); li.appendChild(el("span", null, s.titulo)); ul.appendChild(li);
  });
  det.appendChild(ul);
  var info = el("div", "stack"); info.style.marginTop = "10px";
  [f.periodo, f.carga, f.divisao, f.meta].forEach(function(s){ if(s) info.appendChild(el("p", "small muted", s)); });
  det.appendChild(info); c.appendChild(det);
  app.appendChild(c);
}

function renderReviews(){
  var now = Date.now(), g = {d1:[], d7:[], d30:[]};
  Object.keys(notas).forEach(function(id){
    if(id === "diagnostico") return;
    var n = notas[id]; if(!n || !n.total || !n.quando) return;
    var first = Date.parse(n.primeira || n.quando), last = Date.parse(n.quando);
    if(isNaN(first) || isNaN(last)) return;
    var age = Math.floor((now - first) / DAY);
    if(age >= 30){ if(last < first + 29 * DAY) g.d30.push(id); }
    else if(age >= 7){ if(last < first + 6 * DAY) g.d7.push(id); }
    else if(age >= 1 && age <= 2 && (n.tentativas || 1) === 1) g.d1.push(id);
  });
  var c = el("section", "card");
  c.appendChild(el("span", "kicker", "Revisões pendentes"));
  var any = g.d1.length + g.d7.length + g.d30.length;
  if(!any) c.appendChild(el("p", "muted", "Nada pendente hoje. Cada aula volta aqui 1, 7 e 30 dias depois do primeiro teste."));
  [["d1", "24 horas: releia o resumo e as questões erradas"], ["d7", "7 dias: refaça o teste da aula"], ["d30", "30 dias: refaça o teste e escreva um resumo de uma página"]].forEach(function(k){
    if(!g[k[0]].length) return;
    var grp = el("div", "revgrp"); grp.appendChild(el("h3", null, k[1]));
    g[k[0]].forEach(function(id){ grp.appendChild(aulaRow(findAula(id.toUpperCase()) || [id.toUpperCase(), notas[id].titulo || ""])); });
    c.appendChild(grp);
  });
  var today = isoLocal(new Date()), nx = (plano.revisoes30 || []).filter(function(d){ return d >= today; })[0];
  if(nx) c.appendChild(el("p", "small muted", "Próximo domingo de revisão de 30 dias: " + brDate(nx) + "."));
  app.appendChild(c);
}

function renderConcursos(){
  var c = el("section", "card");
  c.appendChild(el("span", "kicker", "Situação dos concursos"));
  c.appendChild(el("p", "small muted", "Conferida em " + (plano.atualizado || "–") + ". Oficial: ato ou comunicado do órgão. Previsão: informado pelo órgão, ainda sem ato."));
  var list = el("div");
  (plano.concursos || []).forEach(function(k){
    var x = el("div", "conc"); x.appendChild(el("b", null, k.nome));
    var l1 = el("div", "line"); l1.appendChild(el("span", null, k.situacao)); if(k.rotulo) l1.appendChild(el("span", "pill ofi", k.rotulo)); x.appendChild(l1);
    var l2 = el("div", "line"); l2.appendChild(el("span", null, k.marco)); if(k.marcoRotulo) l2.appendChild(el("span", "pill prev", k.marcoRotulo));
    if(k.data){
      var left = Math.round((Date.parse(k.data + "T00:00:00") - Date.parse(isoLocal(new Date()) + "T00:00:00")) / DAY);
      l2.appendChild(el("span", "muted small", left > 1 ? "prazo em " + left + " dias" : left === 1 ? "prazo amanhã" : left === 0 ? "prazo hoje" : "prazo vencido: confira se o edital saiu"));
    }
    x.appendChild(l2); list.appendChild(x);
  });
  c.appendChild(list);
  if(plano.alvo) c.appendChild(el("p", "small", plano.alvo));
  if(plano.documento){
    var a = el("a", "btn ghost", "Abrir o plano completo"); a.href = plano.documento; a.target = "_blank"; a.rel = "noopener";
    var w = el("div", "btns"); w.appendChild(a); c.appendChild(w);
  }
  app.appendChild(c);
}

/* ---------- aula e teste ---------- */
function openItem(id){
  app.textContent = ""; bar.classList.remove("show");
  var back = el("a", "back", "← Central de estudos"); back.href = "#inicio"; app.appendChild(back);
  if(ready.indexOf(id) < 0){
    var c = el("section", "card");
    c.appendChild(el("h2", null, id.toUpperCase() + " ainda não foi criada"));
    c.appendChild(el("p", "muted", "Peça no chat: “criar a aula " + id.toUpperCase() + "”. Ela aparece aqui assim que ficar pronta."));
    app.appendChild(c); return;
  }
  var wait = el("p", "muted", "Carregando…"); app.appendChild(wait);
  var path = id === "diagnostico" ? "data/diagnostico.json" : "data/aulas/" + id + ".json";
  getJSON(path).then(function(data){
    if(route() !== id) return;
    wait.remove();
    var diag = id === "diagnostico";
    var draft = lsGet("inss-rascunho-" + id);
    var n = data.questoes.length;
    cur = {id:id, data:data, diag:diag, graded:false, answers:(draft && draft.length === n) ? draft : new Array(n).fill(null)};
    var head = el("header", "stack");
    head.appendChild(el("span", "kicker", diag ? "Antes da semana 1" : id.toUpperCase() + " · " + (data.disciplina || "") + (data.modulo ? " · " + data.modulo : "")));
    head.appendChild(el("h1", null, data.titulo));
    if(diag) head.appendChild(el("p", "muted", "Responda sem consultar nada. Se não souber, marque Não sei: chute esconde o que precisa de estudo. Todas as questões foram elaboradas para o curso."));
    else if(data.atualizado) head.appendChild(el("p", "muted small", "Aula escrita em " + data.atualizado));
    app.appendChild(head);
    if(data.html){ var les = el("article", "lesson"); les.innerHTML = data.html; app.appendChild(les); }
    var res = el("section", "card"); res.id = "result"; res.style.display = "none"; app.appendChild(res);
    var qz = el("section", "stack"); qz.id = "quiz";
    if(!diag) qz.appendChild(el("h2", null, "Teste da aula"));
    app.appendChild(qz);
    buildQuiz(); paintQuiz(); bar.classList.add("show");
    window.scrollTo(0, 0);
  }).catch(function(){ wait.textContent = "Não foi possível carregar este conteúdo. Verifique a conexão e abra de novo."; });
}

function buildQuiz(){
  var qz = document.getElementById("quiz"), Q = cur.data.questoes, num = 0;
  function card(q, i){
    num++;
    var c = el("article", "q"); c.id = "q" + i;
    var h = el("div", "q-head"); h.appendChild(el("span", "q-num", "Questão " + num)); h.appendChild(el("span", null, q.fonte || "Elaborada para o curso")); c.appendChild(h);
    c.appendChild(el("p", null, q.t));
    var opts = el("div", "opts");
    var labels = cur.diag ? q.o.concat(["Não sei"]) : q.o;
    labels.forEach(function(label, k){
      var val = k === q.o.length ? -1 : k;
      var b = el("button", "opt" + (val === -1 ? " skip" : ""), label); b.type = "button"; b.dataset.v = val; b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function(){ if(cur.graded) return; cur.answers[i] = val; lsSet("inss-rascunho-" + cur.id, cur.answers); paintQuiz(); });
      opts.appendChild(b);
    });
    c.appendChild(opts); c.appendChild(el("div", "fb")); return c;
  }
  if(cur.diag){
    DORDER.forEach(function(code){
      var has = Q.some(function(q){ return q.d === code; }); if(!has) return;
      var g = el("section", "group"); g.appendChild(el("h3", null, DNAMES[code]));
      Q.forEach(function(q, i){ if(q.d === code) g.appendChild(card(q, i)); }); qz.appendChild(g);
    });
  } else Q.forEach(function(q, i){ qz.appendChild(card(q, i)); });
}

function paintQuiz(){
  var Q = cur.data.questoes, answered = 0;
  Q.forEach(function(q, i){
    var c = document.getElementById("q" + i), a = cur.answers[i];
    if(a !== null) answered++;
    c.classList.toggle("done", cur.graded);
    c.querySelectorAll(".opt").forEach(function(b){
      var v = Number(b.dataset.v);
      b.setAttribute("aria-pressed", a === v ? "true" : "false"); b.classList.remove("right", "wrong"); b.disabled = cur.graded;
      if(cur.graded){ if(v === q.a) b.classList.add("right"); else if(a === v && v !== -1) b.classList.add("wrong"); }
    });
    var fb = c.querySelector(".fb"); fb.className = "fb"; fb.textContent = "";
    if(cur.graded){
      var kind = a === q.a ? "ok" : (a === null || a === -1 ? "skip" : "bad"); fb.classList.add(kind);
      fb.appendChild(el("strong", null, (kind === "ok" ? "Você acertou." : kind === "bad" ? "Você errou." : "Sem resposta.") + " Resposta: " + q.o[q.a] + "."));
      fb.appendChild(document.createTextNode(q.c));
    }
  });
  document.getElementById("count").textContent = cur.graded ? "Teste corrigido" : answered + " de " + Q.length + " respondidas";
  document.getElementById("gradeBtn").textContent = cur.graded ? "Ver resultado" : "Corrigir teste";
}

function grade(){
  var Q = cur.data.questoes, hit = 0, by = {};
  Q.forEach(function(q, i){
    var ok = cur.answers[i] === q.a; if(ok) hit++;
    if(q.d){ by[q.d] = by[q.d] || {a:0, t:0}; by[q.d].t++; if(ok) by[q.d].a++; }
  });
  cur.graded = true;
  var old = notas[cur.id] || {};
  var rec = {id:cur.id, titulo:cur.data.titulo, total:Q.length, ultima:hit, melhor:Math.max(hit, old.melhor || 0),
    tentativas:(old.tentativas || 0) + 1, respostas:cur.answers.slice(), quando:new Date().toISOString()};
  rec.primeira = old.primeira || old.quando || rec.quando; // data do primeiro teste, base das revisões de 1, 7 e 30 dias
  if(Object.keys(by).length) rec.porDisciplina = by;
  lsSet("inss-rascunho-" + cur.id, null);
  paintQuiz();
  var res = document.getElementById("result"); res.textContent = ""; res.style.display = "flex";
  res.appendChild(el("span", "kicker", "Resultado"));
  var sc = el("div"); sc.appendChild(el("span", "score", hit + "/" + Q.length)); sc.appendChild(el("span", "muted small", "  acertos · " + pct(hit, Q.length) + "% · tentativa " + rec.tentativas)); res.appendChild(sc);
  if(rec.porDisciplina){
    var rows = el("div", "rows");
    DORDER.forEach(function(code){
      var v = by[code]; if(!v) return;
      var r = el("div", "srow"); r.appendChild(el("span", null, DNAMES[code])); r.appendChild(el("b", null, v.a + "/" + v.t + " · " + pct(v.a, v.t) + "%"));
      var tr = el("div", "track"), f = el("div", "fill"); f.style.width = pct(v.a, v.t) + "%"; tr.appendChild(f); r.appendChild(tr); rows.appendChild(r);
    });
    res.appendChild(rows);
    res.appendChild(el("p", "muted small", "Leitura: até 40% é ponto de partida do zero; de 41% a 70%, base parcial; acima de 70%, a disciplina pode virar sessão só de questões."));
  }
  var m = el("div"); m.id = "saveMsg"; m.setAttribute("role", "status"); res.appendChild(m);
  var bw = el("div", "btns");
  var again = el("button", "btn ghost", "Refazer o teste"); again.type = "button";
  again.addEventListener("click", function(){ cur.answers = new Array(Q.length).fill(null); cur.graded = false; res.style.display = "none"; paintQuiz(); document.getElementById("quiz").scrollIntoView({behavior:"smooth", block:"start"}); });
  var home = el("a", "btn", "Voltar à Central"); home.href = "#inicio";
  bw.appendChild(again); bw.appendChild(home); res.appendChild(bw);
  saveNota(cur.id, rec);
  res.scrollIntoView({behavior:"smooth", block:"start"});
}

document.getElementById("gradeBtn").addEventListener("click", function(){
  if(!cur) return;
  if(!cur.graded) grade(); else document.getElementById("result").scrollIntoView({behavior:"smooth", block:"start"});
});

function render(){ var r = route(); if(r === "inicio") renderHome(); else openItem(r); }
window.addEventListener("hashchange", render);

Promise.all([getJSON("data/catalogo.json"), getJSON("data/prontas.json")]).then(function(v){
  catalog = v[0]; ready = v[1].prontas || []; render(); initNotas();
  getJSON("data/plano.json").then(function(p){ plano = p; refreshHome(); }).catch(function(){});
}).catch(function(){ app.textContent = ""; app.appendChild(el("p", null, "Não foi possível carregar o curso. Verifique a conexão e abra a página de novo.")); });
</script>
