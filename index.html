<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de estudos · INSS, BACEN e Receita</title>
<style>
body{margin:0;background:#f3f5f6;color:#16242b;font-family:"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.6}
@media (prefers-color-scheme: dark){ body{background:#0f181c;color:#e6eef1} }
p{max-width:680px;margin:40px auto;padding:0 16px}
</style>
</head>
<body>
<p id="msg">Carregando a versão mais recente da Central…</p>
<script>
// Carregador: busca o app.html mais recente direto do repositório, sem depender da
// republicação do GitHub Pages. Se o repositório não responder, usa a cópia publicada.
(function(){
  var REMOTE = "https://raw.githubusercontent.com/jonasspinoladev/curso-inss/main/app.html";
  function get(url){
    return fetch(url + "?t=" + Date.now(), {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error(url);
      return r.text();
    });
  }
  get(REMOTE).catch(function(){ return get("app.html"); }).then(function(html){
    document.open(); document.write(html); document.close();
  }).catch(function(){
    document.getElementById("msg").textContent = "Não foi possível carregar a Central. Verifique a conexão e abra a página de novo.";
  });
})();
</script>
</body>
</html>
